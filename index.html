<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1021" />
    <meta name="description" content="Caro (Gomoku): get five in a row. Play the computer or a friend." />
    <title>Caro</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1021'/%3E%3Cpath d='M9 9l14 14M23 9L9 23' stroke='%23ff7088' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('caro:theme'));
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
